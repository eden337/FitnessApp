services:
  postgres:
    image: postgres:16-alpine
    container_name: fitnessapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitnessapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitnessapp}
      POSTGRES_DB: ${POSTGRES_DB:-fitnessapp}
    ports:
      - "5432:5432"
    volumes:
      - fitnessapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitnessapp} -d ${POSTGRES_DB:-fitnessapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: fitnessapp-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fitnessapp_pgdata:
